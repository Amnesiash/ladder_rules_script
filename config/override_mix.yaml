# Mihomo 覆写配置
# 日期：2026-09-07
# 配置作者：https://github.com/Amnesiash
# 适用版本：所有使用 Clash Meta 核心的程序


# ==================== 锚点配置 ====================
# 策略组类型模板 - 定义不同的策略组基础配置
auto:  &a2 {type: url-test, include-all: true, exclude-type: direct, interval: 900, lazy: true, url: 'http://www.gstatic.com/generate_204', hidden: false} 

# 规则集行为模板
c: &r1 {type: http, behavior: classical, interval: 86400}

# 策略组
proxy-groups:
  # 应用策略层 - Select手动选择，支持多场景应用优化，使用时默认，也可修改
  - name: 手动选择
    type: select
    include-all: true
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/vpnlogo/Meta.png

  - name: 代理加速
    type: select
    proxies: [自动选择, 香港, 台湾, 日本, 新国, 美国, 手动选择, DIRECT]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Global.png

  - name: AI
    type: select
    proxies: [自动选择, 香港, 台湾, 日本, 新国, 美国, 手动选择, DIRECT]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/color/OpenAI.png

  - name: Telegram
    type: select
    proxies: [自动选择, 香港, 台湾, 日本, 新国, 美国, 手动选择, DIRECT]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Telegram.png

  - name: 微软服务
    type: select
    proxies: [DIRECT, 自动选择, 香港, 台湾, 日本, 新国, 美国, 手动选择]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Microsoft.png

  - name: 国际流媒体
    type: select
    proxies: [自动选择, 香港, 台湾, 日本, 新国, 美国, 手动选择, DIRECT]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Streaming.png

  - name: 漏网之鱼
    type: select
    proxies: [DIRECT, 自动选择, 香港, 台湾, 日本, 新国, 美国, 手动选择]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Final.png

  # 地理策略层 - 自动测速节点选择
  - name: 自动选择
    <<: *a2
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Auto.png

  - name: 香港
    <<: *a2
    filter: "(?i)港|hk|hongkong|hong kong"
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/HK.png

  - name: 台湾
    <<: *a2
    filter: "(?i)台|tw|taiwan"
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/TW.png

  - name: 日本
    <<: *a2
    filter: "(?i)日|jp|japan"
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/JP.png

  - name: 新国
    <<: *a2
    filter: "(?i)新|sg|singapore"
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/SG.png

  - name: 美国
    <<: *a2
    filter: "(?i)美|us|unitedstates|united states"
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/US.png

# 规则集
rule-providers:
  Lan:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/Lan_classical_24817c9e646b9514.yaml

  Direct:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/Direct_classical_055a900ccd414d6a.yaml

  SteamCN:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/SteamCN_classical_f12eaf58b7866555.yaml

  GlobalAI:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/GlobalAI_classical_53616f647b807ae2.yaml

  Telegram:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/Telegram_classical_ec67e1f0a43104a8.yaml

  GlobalMedia:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/GlobalMedia_classical_f0880cec2c24ebd6.yaml

  Proxy+:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/custom/proxy+.list

  Global:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/Global_classical_84d7c926159da35f.yaml

  China:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/China_classical_488d107c687bae96.yaml

  ChinaIps:
    <<: *r1
    url: https://magicrule.pages.dev/data/_shared/artifacts/ChinaIPs_classical_ef098f9be13f0809.yaml

# 规则路由
rules:
  # > 订阅规则
  - RULE-SET, Lan, DIRECT
  - RULE-SET, Direct, DIRECT
  - RULE-SET, Telegram, Telegram
  - RULE-SET, GlobalMedia, 国际流媒体
  - RULE-SET, SteamCN, DIRECT
  - RULE-SET, Proxy+, 代理加速
  - RULE-SET, China, DIRECT
  - RULE-SET, ChinaIps, DIRECT
  - RULE-SET, GlobalAI, AI
  - RULE-SET, Global, 代理加速
  - GEOIP, CN, DIRECT

  # 兜底规则
  - MATCH, 漏网之鱼
