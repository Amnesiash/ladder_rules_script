    url: https://raw.githubusercontent.com/Amnesiash/ladder_rules_script/main/rules/mihomo/steamcn.yaml

  ai:
    <<: *r1
    url: https://raw.githubusercontent.com/Amnesiash/ladder_rules_script/main/rules/mihomo/ai.yaml

  telegram:
    <<: *r1
    url: https://raw.githubusercontent.com/Amnesiash/ladder_rules_script/main/rules/mihomo/telegram.yaml

