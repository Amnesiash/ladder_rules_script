# Mihomo 配置（白名单版 / classical 规则集）
# 日期：2026-11-06
# 配置作者：https://github.com/Amnesiash
# 适用版本：所有使用 Clash Meta 核心的程序
#
# 与 mihomo_mix_classical.yaml 的差异（白名单范式，参考 iKeLee 样例）：
# 1. 境内白名单直连：Private / Direct / SteamCN / China + GEOIP,CN，未命中的流量一律走 FallBack 代理兜底
# 2. 删除组与规则：自动选择 / 代理加速 / 微软服务 / 国际流媒体 / 漏网之鱼
# 3. 新增 FallBack（fallback 故障转移组，套 6 个地区自动策略，紧跟 Telegram 之后）与 其他自动策略（联合国旗，排在地理策略层最后）
# 4. 自用补充集独立为 Proxy+ 规则集（rules/custom/AddProxy.list 生成），命中走 FallBack
#    Proxy+ 在 rule_source.txt 的段标题标了 `[Proxy+]!skip mrs`（MRS domain 会丢 DOMAIN-KEYWORD），
#    两版配置统一引用 classical 的 rules/release/proxy+.list
# 5. 地区组统一「XX自动策略」命名，filter 换词边界正则，排除 回国 / 校园 / 游戏 节点
# 6. AI / Telegram 组 include-all 并把 FallBack 置顶
# 7. classical 版规则集为混合类型单文件，IP 规则的 no-resolve 由产物自身保证


# ==================== 锚点配置 ====================
# 代理提供者模板 - 订阅源基础配置
pr: &a1 {type: http, interval: 86400, health-check: {enable: true, url: 'http://www.gstatic.com/generate_204', interval: 1800}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

# 策略组类型模板 - 地区自动测速（词边界匹配靠各组的 filter）
auto: &a2 {type: url-test, include-all: true, exclude-type: direct, interval: 120, tolerance: 30, lazy: true, timeout: 2000, max-failed-times: 3, url: 'http://www.gstatic.com/generate_204', hidden: true}

# 兜底故障转移模板 - 按列表顺序取第一个测速可用项
fb: &a3 {type: fallback, interval: 60, lazy: true, timeout: 2000, max-failed-times: 3, url: 'http://www.gstatic.com/generate_204', hidden: false}
s: &s1 {type: select, include-all: true, proxies: [FallBack]}

# 规则集行为模板
c: &r1 {type: http, behavior: classical, format: text, interval: 86400}

# ==================== 代理提供者 ====================
proxy-providers:
  # Sub1: {<<: *a1, url: '', path: ./proxy/Sub1.yaml, override: {additional-prefix: '[Sub1] '}}
  # Sub2: {<<: *a1, url: '', path: ./proxy/Sub2.yaml, override: {additional-prefix: '[Sub2] '}}

# ==================== 核心配置 ====================
#基础配置
mixed-port: 7890      # 混合端口 HTTP和SOCKS5用一个端口
allow-lan: true       # 允许局域网的连接（可用来共享代理）
mode: rule            # 规则模式：rule（规则） / global（全局代理）/ direct（全局直连）/ script (脚本)
log-level: info       # 设置日志输出级别 (5 个级别：silent / error / warning / info / debug）
ipv6: true            # 开启 IPv6 总开关,关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
udp: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 600

geo-auto-update: true
geo-update-interval: 24
geox-url:
  # geoip: 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat'
  # geosite: 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat'
  mmdb: 'https://github.com/Masaiki/GeoIP2-CN/raw/release/Country.mmdb'
  asn: 'https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb'

# 管理面板配置
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090   #外部控制器,可以使用 RESTful API 来控制你的 clash 内核
secret: ''

# 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN模式配置
tun:
  enable: true
  stack: mips
  dns-hijack:
    - "any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS配置
dns:
  enable: true                 # 关闭将使用系统 DNS
  listen: 0.0.0.0:1053         # DNS监听地址
  ipv6: true                   # IPV6解析开关；如果为false，将返回ipv6结果为空
  prefer-h3: true              # 优先使用HTTP/3协议
  enhanced-mode: fake-ip       # 模式：redir-host或fake-ip
  fake-ip-range: 198.18.0.1/16 # Fake-IP解析地址池
  fake-ip-filter:              # fake ip 白名单列表'以下地址不会下发fakeip映射用于连接
    - "*"
    - "+.lan"
    - "+.local"
    - "+.miwifi.com"
    - "+.docker.io"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  nameserver:                  # 默认DNS服务器，支持udp/tcp/dot/doh/doq
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://dns.flymc.cc/dns-query

# 策略组
proxy-groups:
  # 专项选择层 - include-all 引入全部节点，FallBack 置顶
  - name: AI
    type: select
    <<: *s1
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/color/OpenAI.png

  - name: Telegram
    type: select
    <<: *s1
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Telegram.png

  # 兜底层 - fallback 故障转移，按顺序取第一个可用地区；MATCH 与 Proxy+ 默认落到这里
  - name: FallBack
    <<: *a3
    proxies: [香港自动策略, 台湾自动策略, 日本自动策略, 新国自动策略, 美国自动策略, 其他自动策略]
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/Final.png

  # 地理策略层 - 自动测速节点选择，其他自动策略 排本层最后
  - name: 香港自动策略
    <<: *a2
    filter: '^(?=.*((?i)🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/HK.png

  - name: 台湾自动策略
    <<: *a2
    filter: '^(?=.*((?i)🇹🇼|台湾|新北|彰化|(\b(TW|TWN|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/TW.png

  - name: 日本自动策略
    <<: *a2
    filter: '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉野|埼玉|九州|(\b(JP|JPN|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/JP.png

  - name: 新国自动策略
    <<: *a2
    filter: '^(?=.*((?i)🇸🇬|新国|狮城|(\b(SG|SGP|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/SG.png

  - name: 美国自动策略
    <<: *a2
    filter: '^(?=.*((?i)🇺🇸|美国|波特兰|凤凰城|(\b(US|USA|America|States)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/US.png

  - name: 其他自动策略
    <<: *a2
    filter: '^(?!.*((?i)🇭🇰|🇹🇼|🇯🇵|🇸🇬|🇺🇸|香港|台湾|日本|新国|美国|回国|校园|游戏|🎮|(\b(HK|HKG|Hong|TW|TWN|Taiwan|JP|JPN|Japan|SG|SGP|Singapore|US|USA|America|States|GAME)(\d+)?\b))).*$'
    icon: https://github.com/Amnesiash/ladder_rules_script/raw/main/gallery/Orz-3/Color/UN.png

# 规则集
rule-providers:
  Private:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/private.list
    path: ./ruleset/private.list

  Direct:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/direct.list
    path: ./ruleset/direct.list

  SteamCN:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/extra/steamcn.list
    path: ./ruleset/extra/steamcn.list

  AI:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/ai.list
    path: ./ruleset/ai.list

  Telegram:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/extra/telegram.list
    path: ./ruleset/extra/telegram.list

  Proxy+:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/proxy%2B.list
    path: ./ruleset/proxy+.list

  China:
    <<: *r1
    url: https://github.com/Amnesiash/ladder_rules_script/raw/main/rules/release/china.list
    path: ./ruleset/china.list

# 规则路由
rules:
  # > 本机 / 自用直连
  - RULE-SET, Private, DIRECT
  - RULE-SET, Direct, DIRECT

  # > 专项代理（排在境内白名单前，防止境内集截胡）
  - RULE-SET, AI, AI
  - RULE-SET, Telegram, Telegram
  - RULE-SET, SteamCN, DIRECT

  # > 自用补充集 → 兜底代理
  - RULE-SET, Proxy+, FallBack

  # > 境内白名单兜底：命中直连，未命中的流量默认走代理（白名单范式）
  - RULE-SET, China, DIRECT
  - GEOIP, CN, DIRECT
  - MATCH, FallBack